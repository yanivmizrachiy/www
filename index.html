<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>המודל החכם</title>
    <meta name="description" content="כלי אמת למורים מעל Moodle. תלמידים, משימות, ציונים, פעילות ודוחות — רק מנתונים אמיתיים." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      const guideMarker = '/guide';
      const guideIndex = location.pathname.indexOf(guideMarker);
      const isGuideRoute = guideIndex >= 0 && (
        guideIndex + guideMarker.length === location.pathname.length ||
        location.pathname[guideIndex + guideMarker.length] === '/'
      );
      if (isGuideRoute) {
        const siteBase = location.pathname.slice(0, guideIndex);
        const withBase = (path) => `${siteBase}${path}`;

        document.documentElement.dataset.surface = 'guide';
        document.title = 'מדריך Moodle למורים';

        const description = document.querySelector('meta[name="description"]');
        if (description) {
          description.setAttribute('content', 'מצגת אינטראקטיבית למורי Moodle: שאלה אחת בכל שקף, צילומים אמיתיים ורצף לחיצות ברור.');
        }

        const guideStyles = document.createElement('link');
        guideStyles.rel = 'stylesheet';
        guideStyles.href = withBase('/guide-visual-isolation.css');
        guideStyles.dataset.guideStyles = 'true';
        document.head.appendChild(guideStyles);

        const focusOverlays = document.createElement('script');
        focusOverlays.src = withBase('/guide/focus-overlays.js');
        focusOverlays.defer = true;
        focusOverlays.dataset.guideFocus = 'true';
        document.head.appendChild(focusOverlays);

        [
          [withBase('/guide/jerusalem-math-logo.webp'), 'image/webp'],
          [withBase('/guide/screenshots/01-login.avif'), 'image/avif'],
          [withBase('/guide/screenshots/02-my-courses-home.avif'), 'image/avif'],
        ].forEach(([href, type]) => {
          const preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'image';
          preload.type = type;
          preload.href = href;
          document.head.appendChild(preload);
        });

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register(withBase('/guide/sw.js'), { scope: withBase('/guide/') }).catch(() => {});
          });
        }
      }
    </script>
  </head>
  <body><div id="root"></div><script>!function(){function e(){try{var e=window.frameElement;if(!e)return;e.style.setProperty("width","100vw","important");e.style.setProperty("height","100vh","important");e.style.setProperty("position","fixed","important");e.style.setProperty("top","0","important");e.style.setProperty("left","0","important");e.style.setProperty("z-index","9999","important");e.style.setProperty("border","none","important");var t=e.parentElement;if(t){t.style.setProperty("padding","0","important");t.style.setProperty("overflow","hidden","important")}}catch(e){}}e();document.addEventListener("DOMContentLoaded",e);window.addEventListener("load",e)}();</script>
  <script type="module" src="/src/main.tsx"></script></body>
</html>
