name: Guide Live Smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render to deploy this exact commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://www-tijc.onrender.com
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            HEALTH_CODE="$(curl -sS -o /tmp/guide-health.txt -w '%{http_code}' --max-time 20 "${BASE_URL}/health" || true)"
            RELEASE_CODE="$(curl -sS -o /tmp/guide-release.json -w '%{http_code}' --max-time 20 "${BASE_URL}/guide/release.json" || true)"
            echo "Attempt ${attempt}/24: health=${HEALTH_CODE:-curl-error} release=${RELEASE_CODE:-curl-error} expected=${EXPECTED_SHA}"

            if [ "$HEALTH_CODE" = "200" ] && [ "$RELEASE_CODE" = "200" ]; then
              LIVE_SHA="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/guide-release.json','utf8'));process.stdout.write(x.commit||'')}catch(e){process.stdout.write('invalid-json')}")"
              echo "Live guide commit: ${LIVE_SHA:-missing}"

              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                GUIDE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}/guide" || true)"
                SHOT_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}/guide/screenshots/01-login.jpg" || true)"
                echo "Final endpoints: guide=${GUIDE_CODE:-curl-error} screenshot=${SHOT_CODE:-curl-error}"
                if [ "$GUIDE_CODE" = "200" ] && [ "$SHOT_CODE" = "200" ]; then
                  echo "Verified: /guide, release marker, and a real Moodle screenshot are live for ${EXPECTED_SHA}."
                  exit 0
                fi
              fi
            fi

            sleep 10
          done

          echo "Render did not expose the expected guide commit within the verification window."
          echo "Last health response:"
          cat /tmp/guide-health.txt 2>/dev/null || true
          echo
          echo "Last release response:"
          cat /tmp/guide-release.json 2>/dev/null || true
          exit 1
