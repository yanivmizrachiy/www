name: Guide Live Smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main content
        uses: actions/checkout@v4

      - name: Compute canonical Guide fingerprint
        shell: bash
        run: |
          set -euo pipefail
          GUIDE_HASH="$(node scripts/maintenance/guide-content-hash.cjs)"
          echo "EXPECTED_GUIDE_HASH=${GUIDE_HASH}" >> "$GITHUB_ENV"
          echo "Canonical Guide hash: ${GUIDE_HASH}"

      - name: Wait for live Guide content to match main
        env:
          BASE_URL: https://www-tijc.onrender.com
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            HEALTH_CODE="$(curl -sS -o /tmp/guide-health.txt -w '%{http_code}' --max-time 20 "${BASE_URL}/health" || true)"
            RELEASE_CODE="$(curl -sS -o /tmp/guide-release.json -w '%{http_code}' --max-time 20 "${BASE_URL}/guide/release.json" || true)"
            echo "Attempt ${attempt}/36: health=${HEALTH_CODE:-curl-error} release=${RELEASE_CODE:-curl-error} expectedGuideHash=${EXPECTED_GUIDE_HASH}"

            if [ "$HEALTH_CODE" = "200" ] && [ "$RELEASE_CODE" = "200" ]; then
              LIVE_HASH="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/guide-release.json','utf8'));process.stdout.write(x.guideHash||'')}catch(e){process.stdout.write('invalid-json')}")"
              LIVE_SHA="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/guide-release.json','utf8'));process.stdout.write(x.commit||'')}catch(e){}")"
              LIVE_BRANCH="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('/tmp/guide-release.json','utf8'));process.stdout.write(x.branch||'')}catch(e){}")"
              echo "Live Guide: hash=${LIVE_HASH:-missing} commit=${LIVE_SHA:-missing} branch=${LIVE_BRANCH:-missing}"

              if [ "$LIVE_HASH" = "$EXPECTED_GUIDE_HASH" ]; then
                GUIDE_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}/guide" || true)"
                SHOT_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}/guide/screenshots/01-login.avif" || true)"
                SW_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${BASE_URL}/guide/sw.js" || true)"
                echo "Final endpoints: guide=${GUIDE_CODE:-curl-error} avif=${SHOT_CODE:-curl-error} sw=${SW_CODE:-curl-error}"
                if [ "$GUIDE_CODE" = "200" ] && [ "$SHOT_CODE" = "200" ] && [ "$SW_CODE" = "200" ]; then
                  echo "Verified: live Guide content matches canonical main fingerprint ${EXPECTED_GUIDE_HASH}."
                  exit 0
                fi
              fi
            fi

            sleep 10
          done

          echo "Live Guide did not match canonical main content fingerprint within the verification window."
          echo "Last health response:"
          cat /tmp/guide-health.txt 2>/dev/null || true
          echo
          echo "Last release response:"
          cat /tmp/guide-release.json 2>/dev/null || true
          exit 1
