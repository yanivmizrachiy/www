name: Repo Hygiene

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Verify canonical structure and repository cleanliness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repository doctor
        run: node scripts/checks/repo-doctor.cjs

      - name: Summary
        if: success()
        run: |
          echo "REPO_HYGIENE_OK"
          echo "Canonical truth files exist, retired/generated paths are absent, private/raw exports are not tracked, and August host scope is constrained."
