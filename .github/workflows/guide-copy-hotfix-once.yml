name: Guide Copy Hotfix Once

on:
  push:
    branches:
      - fix/guide-remove-demo-copy-20260908

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guide-remove-demo-copy-20260908
          fetch-depth: 0

      - name: Remove internal copy from public Guide cover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/data/guideDeckSource.ts')
          text = source.read_text(encoding='utf-8')
          old = "summary: 'מצגת אינטראקטיבית קצרה: שאלה אחת בכל שקף, צילום אמיתי ורצף לחיצות ברור.',"
          if old not in text:
              raise SystemExit('Expected Guide cover internal summary was not found')
          source.write_text(text.replace(old, "summary: '',", 1), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = "description.setAttribute('content', 'מצגת אינטראקטיבית למורי Moodle: שאלה אחת בכל שקף, צילומים אמיתיים ורצף לחיצות ברור.');"
          new = "description.setAttribute('content', 'מדריך למורים במערכת Moodle במחוז ירושלים והעיר ירושלים.');"
          if old not in text:
              raise SystemExit('Expected Guide internal meta description was not found')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          git rm .github/workflows/guide-copy-hotfix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/guideDeckSource.ts index.html
          git commit -m "fix(guide): remove internal copy from public cover"
          git push origin HEAD:fix/guide-remove-demo-copy-20260908
