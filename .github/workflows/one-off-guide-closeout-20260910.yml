name: One-off Guide Closeout 2026-09-10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-off-guide-closeout-20260910.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source closeout patch
        run: python3 scripts/maintenance/guide-cover-closeout-20260910.py

      - name: Install dependencies
        run: npm ci

      - name: Verify Guide and repository
        run: |
          npm run check
          node scripts/checks/guide-integrity-audit.cjs
          node scripts/checks/guide-presentation-quality-audit.cjs
          node scripts/checks/guide-asset-integrity-audit.cjs
          npm run typecheck
          npm run doctor
          npm run build -- --base /www/guide/

      - name: Commit source closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-off-guide-closeout-20260910.yml
          git rm scripts/maintenance/guide-cover-closeout-20260910.py
          git add src/pages/Guide.tsx public/guide-visual-isolation.css PROJECT_MEMORY.md public/PROJECT_MEMORY.md STATE/CURRENT.md scripts/checks/guide-presentation-quality-audit.cjs
          git diff --cached --check
          git commit -m 'fix(guide): make final cover contract source-native'
          git push origin HEAD:main
