name: Guide One Click Migration

on:
  push:
    branches:
      - feat/guide-one-click-per-slide-20260909

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair migration template escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/maintenance/apply-guide-one-click-20260909.cjs')
          s = p.read_text(encoding='utf-8')
          for name in ('id', 'stepCount', 'screenshotCount', 'fragment'):
              s = s.replace('\\\\${' + name + '}', '\\${' + name + '}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply canonical Guide migration
        run: node scripts/maintenance/apply-guide-one-click-20260909.cjs

      - name: Verify source truth mirror
        shell: bash
        run: cmp PROJECT_MEMORY.md public/PROJECT_MEMORY.md

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run typecheck
          node scripts/checks/guide-integrity-audit.cjs
          node scripts/checks/guide-presentation-quality-audit.cjs
          npm run build
          npm run doctor

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/maintenance/apply-guide-one-click-20260909.cjs
          rm -f .github/workflows/guide-one-click-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'feat(guide): one action per opening slide'
          git push origin HEAD:feat/guide-one-click-per-slide-20260909
