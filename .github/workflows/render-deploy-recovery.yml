name: Render Deploy Recovery

# Scope: the Teacher Hub service on Render, and nothing else.
#
# The Guide is a separate product with a separate runtime: it is built and verified
# only by "Guide Static Always-On" and "Guide Live Smoke" against GitHub Pages.
# Render neither publishes nor validates the Guide, so this workflow must not compute
# or compare a Guide content fingerprint. guide-integrity-audit.cjs enforces that.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-render-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      BASE_URL: https://www-tijc.onrender.com
    steps:
      - name: Checkout canonical main content
        uses: actions/checkout@v4

      - name: Trigger Render deploy when credentials already exist
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${DEPLOY_HOOK_URL:-}" ]; then
            echo "Render deploy hook secret found: RENDER_DEPLOY_HOOK_URL"
            curl -fsS -X POST "$DEPLOY_HOOK_URL" >/tmp/render-trigger.json
            echo "Render deploy hook triggered."
          elif [ -n "${DEPLOY_HOOK:-}" ]; then
            echo "Render deploy hook secret found: RENDER_DEPLOY_HOOK"
            curl -fsS -X POST "$DEPLOY_HOOK" >/tmp/render-trigger.json
            echo "Render deploy hook triggered."
          elif [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            echo "Render API credentials found."
            curl -fsS -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -d '{"clearCache":"do_not_clear"}' >/tmp/render-trigger.json
            echo "Render API deploy triggered."
          else
            echo "NO_RENDER_DEPLOY_CREDENTIALS_CONFIGURED"
          fi

      # AVAILABILITY CHECK ONLY.
      # /health reports that the service answers, not which commit it is running.
      # There is no Teacher Hub source-version endpoint today, and inventing one here
      # would be a fabricated proof, so this step deliberately claims nothing more.
      - name: Verify Teacher Hub availability on Render
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            HEALTH_CODE="$(curl -sS -o /tmp/render-health.json -w '%{http_code}' --max-time 20 "${BASE_URL}/health" || true)"
            echo "Attempt ${attempt}/36: health=${HEALTH_CODE:-curl-error}"

            if [ "$HEALTH_CODE" = "200" ]; then
              echo "RENDER_TEACHER_HUB_AVAILABLE=1"
              echo "NOTE: availability check only - this does not prove which commit Render runs."
              cat /tmp/render-health.json 2>/dev/null || true
              exit 0
            fi
            sleep 10
          done

          echo "Teacher Hub did not return a healthy response on ${BASE_URL}/health in time."
          cat /tmp/render-health.json 2>/dev/null || true
          exit 1
