name: Guide Static Always-On

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/main.tsx'
      - 'src/pages/Guide.tsx'
      - 'src/data/guideDeck.ts'
      - 'src/data/guideHotspots.ts'
      - 'public/guide/**'
      - 'public/guide-visual-isolation.css'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/checks/guide-integrity-audit.cjs'
      - 'scripts/checks/guide-presentation-quality-audit.cjs'
      - 'scripts/checks/guide-asset-integrity-audit.cjs'
      - '.github/workflows/guide-static-always-on.yml'
      - '.github/workflows/guide-live-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide-static-always-on-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GUIDE_ROUTE_BASE: /www/guide
  PROJECT_PAGES_BASE: /www
  GUIDE_DEPLOY_BRANCH: deploy/guide-static

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository
        run: |
          npm run check
          node scripts/checks/guide-integrity-audit.cjs
          if [ -f scripts/checks/guide-presentation-quality-audit.cjs ]; then
            node scripts/checks/guide-presentation-quality-audit.cjs
          fi
          node scripts/checks/guide-asset-integrity-audit.cjs
          npm run typecheck
          npm run doctor

      - name: Build static Guide for repository Pages subpath
        run: npm run build -- --base "${GUIDE_ROUTE_BASE}/"

      - name: Rewrite Guide public asset URLs for project Pages
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const base = process.env.PROJECT_PAGES_BASE;
          const assets = path.join(process.cwd(), 'dist', 'assets');
          for (const name of fs.readdirSync(assets)) {
            if (!name.endsWith('.js')) continue;
            const file = path.join(assets, name);
            const original = fs.readFileSync(file, 'utf8');
            const rewritten = original.replace(/(["'`])\/guide\//g, `$1${base}/guide/`);
            if (rewritten !== original) fs.writeFileSync(file, rewritten, 'utf8');
          }
          NODE

      - name: Prepare generated Guide directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .guide-publish
          mkdir -p .guide-publish
          cp dist/index.html .guide-publish/index.html
          cp -R dist/assets .guide-publish/assets
          # index.html loads this at runtime from the Guide base, so it has to ship with
          # the Guide subtree. Without it the visual isolation layer 404s in production.
          cp dist/guide-visual-isolation.css .guide-publish/guide-visual-isolation.css
          if [ -d dist/guide ]; then
            cp -R dist/guide/. .guide-publish/
          fi
          test -f .guide-publish/index.html
          test -f .guide-publish/guide-visual-isolation.css
          test -f .guide-publish/release.json
          test -f .guide-publish/sw.js
          test -f .guide-publish/jerusalem-math-logo.webp
          test -f .guide-publish/screenshots/01-login.avif
          grep -q '/www/guide/assets/' .guide-publish/index.html
          ! grep -R -F 'SERVICE WAKING UP' .guide-publish
          ! grep -R -F 'www-tijc.onrender.com/guide' .guide-publish
          if grep -R -E '["'"'"'`]\/guide\/(screenshots|jerusalem-math-logo)' .guide-publish/assets/*.js; then
            echo 'Root-only Guide asset URL remains in compiled JavaScript.' >&2
            exit 1
          fi
          echo 'STATIC_GUIDE_ARTIFACT_OK'

      - name: Publish generated Guide to deployment branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/guide-publish
          cp -R .guide-publish /tmp/guide-publish
          git fetch origin main
          git fetch origin "${GUIDE_DEPLOY_BRANCH}:refs/remotes/origin/${GUIDE_DEPLOY_BRANCH}" || true
          git checkout -B "${GUIDE_DEPLOY_BRANCH}" origin/main
          rm -rf guide
          mkdir -p guide
          cp -R /tmp/guide-publish/. guide/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A guide
          if git diff --cached --quiet; then
            echo 'Guide output already matches main; nothing to publish.'
            exit 0
          fi
          git commit -m 'deploy(guide): refresh always-on static presentation'
          git push --force origin HEAD:"${GUIDE_DEPLOY_BRANCH}"
