name: Guide Remove Legacy Quick Start Once

on:
  push:
    branches:
      - fix/guide-consolidated-20260908

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guide-consolidated-20260908
          fetch-depth: 0
      - name: Remove legacy source Quick Start list
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/data/guideDeckSource.ts')
          text = p.read_text(encoding='utf-8')
          marker = '\nexport const QUICK_START_SLIDE_IDS = ['
          if marker not in text:
              raise SystemExit('legacy Quick Start list not found')
          text = text.split(marker, 1)[0].rstrip() + '\n'
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/guide-remove-legacy-quickstart-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/data/guideDeckSource.ts
          git commit -m "refactor(guide): remove legacy Quick Start source list"
          git push origin HEAD:fix/guide-consolidated-20260908
