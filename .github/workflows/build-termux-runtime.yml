name: Build Legacy Termux Runtime Package (manual)

# Manual fallback only. The canonical Teacher Hub runtime is Render and the
# canonical Guide runtime is GitHub Pages. This workflow must never become a
# deployment path for either product and must not run from stale feature branches.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: https://ncoqanascubqkxfvucfz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" || {
            echo "VITE_SUPABASE_PUBLISHABLE_KEY is required; refusing to build a placeholder runtime."
            exit 1
          }
          npm run build

      - name: Verify runtime bridge
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f src/server.js
          grep -q "getSessionFromToken" src/server.js
          grep -q "/api/bootstrap" src/server.js
          grep -q "/api/bootstrap?t=" src/hooks/useLtiSession.ts
          grep -q "frame-ancestors" src/server.js
          node --check src/server.js

      - name: Assemble runtime package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/moodle-runtime-package
          mkdir -p /tmp/moodle-runtime-package/src
          mkdir -p /tmp/moodle-runtime-package/STATE/runtime-package

          cp -R dist /tmp/moodle-runtime-package/dist
          cp src/server.js /tmp/moodle-runtime-package/src/server.js
          cp package.json /tmp/moodle-runtime-package/package.json
          cp package-lock.json /tmp/moodle-runtime-package/package-lock.json

          cat > /tmp/moodle-runtime-package/STATE/runtime-package/manifest.json <<EOF
          {
            "repo": "yanivmizrachiy/www",
            "source_branch": "${GITHUB_REF_NAME}",
            "source_commit": "${GITHUB_SHA}",
            "package": "moodle-teacher-hub-termux-runtime.tar.gz",
            "canonical_runtime": false,
            "manual_fallback_only": true,
            "contains_dist": true,
            "contains_server": true,
            "contains_no_secrets": true,
            "created_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          tar -czf /tmp/moodle-teacher-hub-termux-runtime.tar.gz -C /tmp/moodle-runtime-package .

      - name: Publish legacy runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin termux-runtime || true
          git switch --orphan termux-runtime

          git rm -rf . >/dev/null 2>&1 || true
          rm -rf ./* .github 2>/dev/null || true

          cp /tmp/moodle-teacher-hub-termux-runtime.tar.gz .
          mkdir -p STATE/runtime-package
          tar -xOf moodle-teacher-hub-termux-runtime.tar.gz ./STATE/runtime-package/manifest.json > STATE/runtime-package/manifest.json

          cat > README.md <<EOF
          # Moodle Teacher Hub — Legacy Termux Runtime

          This branch is generated only by an explicit manual workflow run.
          The canonical Teacher Hub runtime is Render; this package is a
          non-canonical fallback artifact and must not be reported as production.

          \`\`\`text
          moodle-teacher-hub-termux-runtime.tar.gz
          \`\`\`

          No secrets are included.
          EOF

          git add README.md moodle-teacher-hub-termux-runtime.tar.gz STATE/runtime-package/manifest.json
          git commit -m "Publish manual legacy Termux runtime package"
          git push -f origin termux-runtime
